name: fetch-probe

# Approach A 다음작업 1번: 상세페이지가 GitHub Actions 러너(해외 IP·쿠키없음·Ubuntu)에서
# fetch되는지 실측. iris(www.iris.go.kr)는 해외 IP 차단 의심 → 여기서만 확인 가능.
# 수동 dispatch 전용, 일일 collect 런과 분리. DB·메일·커밋 부작용 없음.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Probe detail-page fetch
        run: |
          python - <<'PY'
          import urllib.request, ssl, re, html
          ctx = ssl.create_default_context()
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36'
          tests = [
            ('kstartup', 'https://www.k-startup.go.kr/web/contents/bizpbanc-deadline.do?schM=view&pbancSn=172700'),
            ('bizinfo',  'https://www.bizinfo.go.kr/web/lay1/bbs/S1T122C128/AS/74/view.do?pblancId=PBLN_000000000101596'),
            ('msit',     'https://www.msit.go.kr/bbs/view.do?sCode=user&mId=311&mPid=121&bbsSeqNo=100&nttSeqNo=3179651'),
            ('iris',     'https://www.iris.go.kr/contents/retrieveBsnsAncmView.do?ancmId=021938'),
          ]
          for name, url in tests:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': UA})
                  with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                      body = r.read()
                  txt = re.sub(r'<[^>]+>', ' ', body.decode('utf-8', 'replace'))
                  visible = len(re.sub(r'\s+', ' ', html.unescape(txt)).strip())
                  print(f'[{name}] OK status={r.status} bytes={len(body)} visible={visible}')
              except Exception as e:
                  print(f'[{name}] FAIL {type(e).__name__}: {e}')
          PY

      - name: Probe source response contracts without recording payloads
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          python - <<'PYPROBE'
          import json, os, re
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta
          from funded_project_research.adapters.base import http_get, build_url
          from funded_project_research.adapters import kstartup, nara, msit
          from funded_project_research.status import KST
          now = datetime.now(KST)
          params = {'pageNo': 1, 'numOfRows': 100, 'inqryDiv': 1,
                    'inqryBgnDt': (now - timedelta(days=6)).strftime('%Y%m%d') + '0000',
                    'inqryEndDt': now.strftime('%Y%m%d%H%M'), 'type': 'json'}
          probes = [
              ('kstartup-current', kstartup.BASE, {'page': 1, 'perPage': 100, 'returnType': 'json'}),
              ('kstartup-gateway', 'https://apis.data.go.kr/B552735/kisedKstartupService01/getAnnouncementInformation01', {'page': 1, 'perPage': 100, 'returnType': 'json'}),
              ('nara-current', nara.BASE, params),
              ('nara-v02', 'https://apis.data.go.kr/1230000/ad/BidPublicInfoService02/getBidPblancListInfoServc', params),
              ('msit-100', msit.BASE, {'pageNo': 1, 'numOfRows': 100}),
              ('msit-lower', msit.BASE, {'pageNo': 1, 'numOfrows': 100}),
              ('msit-alllower', msit.BASE, {'pageNo': 1, 'numofrows': 100}),
              ('msit-10', msit.BASE, {'pageNo': 1, 'numOfRows': 10}),
              ('nara-exact7', nara.BASE, {**params, 'inqryBgnDt': (now - timedelta(days=7)).strftime('%Y%m%d%H%M')}),
              ('nara-midnight7', nara.BASE, {**params, 'inqryBgnDt': (now - timedelta(days=7)).strftime('%Y%m%d') + '0000'}),
          ]
          def shape(value, depth=0):
              if isinstance(value, dict):
                  return {k: shape(v, depth + 1) for k, v in value.items() if depth < 4}
              if isinstance(value, list):
                  return {'type': 'list', 'length': len(value), 'item': shape(value[0], depth + 1) if value else None}
              return type(value).__name__
          for name, base, params in probes:
              try:
                  raw = http_get(build_url(base, os.environ['SERVICE_KEY'], params), timeout=15)
                  try:
                      value = json.loads(raw)
                      print(name, json.dumps(shape(value)))
                      envelope = value.get('response', value) if isinstance(value, dict) else {}
                      for section in [envelope, envelope.get('header', {}), envelope.get('body', {})]:
                          if isinstance(section, dict):
                              print(name, 'numeric metadata', {k: v for k,v in section.items() if k in ('resultCode', 'code', 'totalCount', 'matchCount', 'numOfRows', 'pageNo', 'perPage') and re.fullmatch(r'[0-9]+', str(v))})
                  except (ValueError, TypeError):
                      try:
                          root = ET.fromstring(raw)
                          print(name, 'xml', root.tag, 'items', len(root.findall('.//item')),
                                'numeric metadata', {k: root.findtext('.//' + k) for k in ('resultCode','totalCount','numOfRows','pageNo') if re.fullmatch(r'[0-9]+',root.findtext('.//' + k) or '')})
                      except ET.ParseError:
                          print(name, 'non-json/non-xml', 'bytes', len(raw))
              except Exception as exc:
                  print(name, 'error', type(exc).__name__, getattr(exc, 'code', ''))
                  if hasattr(exc, 'read'):
                      body = exc.read().decode('utf-8', 'replace')
                      print(name, 'known error markers', [code for code in ('SERVICE_KEY_IS_NOT_REGISTERED_ERROR', 'SERVICE_ACCESS_DENIED_ERROR', 'LIMITED_NUMBER_OF_SERVICE_REQUESTS_EXCEEDS_ERROR', 'INVALID_REQUEST_PARAMETER_ERROR', 'ACCESS DENIED') if code in body])
          PYPROBE
