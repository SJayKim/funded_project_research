name: fetch-probe

# Approach A 다음작업 1번: 상세페이지가 GitHub Actions 러너(해외 IP·쿠키없음·Ubuntu)에서
# fetch되는지 실측. iris(www.iris.go.kr)는 해외 IP 차단 의심 → 여기서만 확인 가능.
# 수동 dispatch 전용, 일일 collect 런과 분리. DB·메일·커밋 부작용 없음.

on:
  workflow_dispatch:
    inputs:
      check_source_health:
        description: "모든 수집 어댑터를 운영 인증으로 읽기 전용 검증"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Probe detail-page fetch
        if: ${{ !inputs.check_source_health }}
        run: |
          python - <<'PY'
          import urllib.request, ssl, re, html
          ctx = ssl.create_default_context()
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36'
          tests = [
            ('kstartup', 'https://www.k-startup.go.kr/web/contents/bizpbanc-deadline.do?schM=view&pbancSn=172700'),
            ('bizinfo',  'https://www.bizinfo.go.kr/web/lay1/bbs/S1T122C128/AS/74/view.do?pblancId=PBLN_000000000101596'),
            ('msit',     'https://www.msit.go.kr/bbs/view.do?sCode=user&mId=311&mPid=121&bbsSeqNo=100&nttSeqNo=3179651'),
            ('iris',     'https://www.iris.go.kr/contents/retrieveBsnsAncmView.do?ancmId=021938'),
          ]
          for name, url in tests:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': UA})
                  with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                      body = r.read()
                  txt = re.sub(r'<[^>]+>', ' ', body.decode('utf-8', 'replace'))
                  visible = len(re.sub(r'\s+', ' ', html.unescape(txt)).strip())
                  print(f'[{name}] OK status={r.status} bytes={len(body)} visible={visible}')
              except Exception as e:
                  print(f'[{name}] FAIL {type(e).__name__}: {e}')
          PY

      - uses: actions/checkout@v4
        if: ${{ inputs.check_source_health }}

      - name: Check production sources without writing data
        if: ${{ inputs.check_source_health }}
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from collections import Counter
          from urllib.error import HTTPError
          from funded_project_research.adapters.base import build_url, http_get
          from funded_project_research.adapters.msit import BASE

          def digits(value):
              text = str(value)
              return text if re.fullmatch(r"[0-9]{1,12}", text) else None

          def summarize(payload):
              if payload.lstrip().startswith(b"<"):
                  root = ET.fromstring(payload)
                  return {"format": "xml", "provider_code": digits(root.findtext(".//returnReasonCode"))}
              metadata = {}
              shapes = {}
              field_counts = Counter()
              ids = []
              metadata_names = ("resultCode", "returnReasonCode", "totalCount", "pageNo", "numOfRows")
              container_names = ("response", "OpenAPI_ServiceResponse", "cmmMsgHeader",
                                 "header", "body", "items", "item", "files", "file")
              data_names = ("subject", "viewUrl", "deptName", "managerName", "managerTel",
                            "pressDt", "fileName", "fileUrl")

              def inspect(value, path, depth=0):
                  if depth > 12:
                      return
                  shapes.setdefault(path, set()).add(type(value).__name__)
                  if isinstance(value, str) and value.lstrip().startswith(("{", "[")):
                      try:
                          decoded = json.loads(value)
                      except ValueError:
                          return
                      inspect(decoded, path + "(decoded)", depth + 1)
                  elif isinstance(value, list):
                      for child in value:
                          inspect(child, path + "[]", depth + 1)
                  elif isinstance(value, dict):
                      for name in metadata_names:
                          if name in value:
                              metadata.setdefault(name, []).append(digits(value[name]))
                      if "viewUrl" in value:
                          match = re.search(r"nttSeqNo=([0-9]{1,12})(?:\D|$)", str(value["viewUrl"]))
                          ids.append(match.group(1) if match else None)
                      for name in data_names:
                          if name in value:
                              field_counts[name] += 1
                      for name in container_names:
                          if name in value:
                              inspect(value[name], path + "." + name, depth + 1)

              inspect(json.loads(payload), "$")
              return {"format": "json", "metadata": metadata, "count": len(ids), "notice_ids": ids,
                      "shape": {key: sorted(types) for key, types in sorted(shapes.items())},
                      "field_counts": field_counts}

          for page in (329, 330, 331):
              result = {"requested_page": page, "requested_size": 10, "requested_format": "json"}
              params = {"pageNo": page, "numOfRows": 10, "returnType": "json"}
              try:
                  payload = http_get(build_url(BASE, os.environ["SERVICE_KEY"], params), timeout=12)
                  result["http_outcome"] = "2xx"
                  result.update(summarize(payload))
              except HTTPError as error:
                  result["http_error"] = error.code
              except Exception as error:
                  result["error_type"] = type(error).__name__
              print(json.dumps(result), flush=True)
          PY
