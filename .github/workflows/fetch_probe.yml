name: fetch-probe

# Approach A 다음작업 1번: 상세페이지가 GitHub Actions 러너(해외 IP·쿠키없음·Ubuntu)에서
# fetch되는지 실측. iris(www.iris.go.kr)는 해외 IP 차단 의심 → 여기서만 확인 가능.
# 수동 dispatch 전용, 일일 collect 런과 분리. DB·메일·커밋 부작용 없음.

on:
  workflow_dispatch:
    inputs:
      check_source_health:
        description: "모든 수집 어댑터를 운영 인증으로 읽기 전용 검증"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Probe detail-page fetch
        if: ${{ !inputs.check_source_health }}
        run: |
          python - <<'PY'
          import urllib.request, ssl, re, html
          ctx = ssl.create_default_context()
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36'
          tests = [
            ('kstartup', 'https://www.k-startup.go.kr/web/contents/bizpbanc-deadline.do?schM=view&pbancSn=172700'),
            ('bizinfo',  'https://www.bizinfo.go.kr/web/lay1/bbs/S1T122C128/AS/74/view.do?pblancId=PBLN_000000000101596'),
            ('msit',     'https://www.msit.go.kr/bbs/view.do?sCode=user&mId=311&mPid=121&bbsSeqNo=100&nttSeqNo=3179651'),
            ('iris',     'https://www.iris.go.kr/contents/retrieveBsnsAncmView.do?ancmId=021938'),
          ]
          for name, url in tests:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': UA})
                  with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                      body = r.read()
                  txt = re.sub(r'<[^>]+>', ' ', body.decode('utf-8', 'replace'))
                  visible = len(re.sub(r'\s+', ' ', html.unescape(txt)).strip())
                  print(f'[{name}] OK status={r.status} bytes={len(body)} visible={visible}')
              except Exception as e:
                  print(f'[{name}] FAIL {type(e).__name__}: {e}')
          PY

      - uses: actions/checkout@v4
        if: ${{ inputs.check_source_health }}

      - name: Check production sources without writing data
        if: ${{ inputs.check_source_health }}
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from collections import Counter
          from urllib.error import HTTPError
          from funded_project_research.adapters.base import SourceError, build_url, http_get
          from funded_project_research.adapters.msit import BASE, _item_to_dict, _json_page

          def digits(value):
              text = str(value)
              return text if re.fullmatch(r"[0-9]{1,12}", text) else None

          def summarize(payload, page, fmt):
              if fmt == "json":
                  rows, total = _json_page(payload, page, 10)
                  result = {"total": total, "verified_page_and_size": True}
              else:
                  root = ET.fromstring(payload)
                  if root.tag == "OpenAPI_ServiceResponse":
                      return {"provider_code": digits(root.findtext(".//returnReasonCode"))}
                  rows = [_item_to_dict(item) for item in root.findall(".//items/item")]
                  result = {"result_code": digits(root.findtext(".//resultCode")),
                            "total": digits(root.findtext(".//totalCount")),
                            "actual_page": digits(root.findtext(".//pageNo")),
                            "actual_size": digits(root.findtext(".//numOfRows"))}

              data_names = ("subject", "viewUrl", "deptName", "managerName", "managerTel", "pressDt")
              field_counts = Counter(name for row in rows for name in data_names if name in row)
              field_counts.update(name for row in rows for file in row.get("files", [])
                                  for name in ("fileName", "fileUrl") if name in file)
              ids = [match.group(1) if (match := re.search(r"nttSeqNo=([0-9]{1,12})(?:\D|$)", row["viewUrl"]))
                     else None for row in rows]
              return {**result, "count": len(rows), "notice_ids": ids, "field_counts": field_counts}

          for page, fmt in ((329, "xml"), (371, "json"), (388, "json"),
                            (418, "json"), (420, "json"), (429, "json")):
              result = {"requested_page": page, "requested_size": 10, "requested_format": fmt}
              params = {"pageNo": page, "numOfRows": 10, "returnType": fmt}
              try:
                  payload = http_get(build_url(BASE, os.environ["SERVICE_KEY"], params), timeout=12)
                  result["http_outcome"] = "2xx"
                  result.update(summarize(payload, page, fmt))
              except HTTPError as error:
                  result["http_error"] = error.code
              except SourceError as error:
                  result["source_error"] = str(error)
              except Exception as error:
                  result["error_type"] = type(error).__name__
              print(json.dumps(result), flush=True)
          PY
