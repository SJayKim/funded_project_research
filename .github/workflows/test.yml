name: tests

on:
  push:
    branches-ignore:
      - data
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run offline tests
        env:
          ANTHROPIC_API_KEY: ""
          RUN_LIVE_EVAL: "0"
        run: python -m unittest discover -s tests -v
