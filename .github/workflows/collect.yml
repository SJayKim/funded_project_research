name: collect

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 09:00 KST.
  workflow_dispatch:
    inputs:
      no_notify:
        description: "첫 실행: 메일 발송 없이 DB만 시딩(폭주 방지)"
        type: boolean
        default: false
      initialize_db:
        description: "최초 설치만: data 브랜치가 없을 때 빈 DB 생성(메일 자동 생략)"
        type: boolean
        default: false
      recheck_only:
        description: "수집/발송 없이 공식 원문 재확인과 대시보드 배포"
        type: boolean
        default: false
      health_only:
        description: "출처 접근 상태와 원문만 점검 (공고 수집 적재·알림·LLM 생략)"
        type: boolean
        default: false

# 예약/수동/브랜치 실행 모두 같은 DB를 쓰므로 하나의 그룹에서 직렬화한다.
concurrency:
  group: collect-data-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run offline tests
        env:
          ANTHROPIC_API_KEY: ""
          RUN_LIVE_EVAL: "0"
        run: python -m unittest discover -s tests -v

      # 원격 오류와 브랜치 부재를 구분한다. 검증/백업 실패 시 이후 단계는 실행하지 않는다.
      - name: Restore DB from data branch
        id: restore
        env:
          INITIALIZE_DB: ${{ inputs.initialize_db }}
        run: |
          args=()
          if [[ "$INITIALIZE_DB" == "true" ]]; then
            args+=(--initialize)
          fi
          python -m scripts.ci_db restore --backup-dir "$RUNNER_TEMP/db-baseline" "${args[@]}"

      - name: Preserve DB baseline before collection
        uses: actions/upload-artifact@v4
        with:
          name: db-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/db-baseline/
          if-no-files-found: error
          retention-days: 30

      - name: Run collector
        id: collector
        if: ${{ !inputs.recheck_only }}
        continue-on-error: true
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          BIZINFO_CRTFC_KEY: ${{ secrets.BIZINFO_CRTFC_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # 미설정 시 빈 문자열 → summarize가 규칙 fallback으로 정상 동작.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # LLM 스위치(repo Variable). 미설정/빈 값=on, "off"=요약 fallback+enrich 스킵.
          LLM_ENABLED: ${{ vars.LLM_ENABLED }}
          # 모델 오버라이드(미설정 시 코드 기본값: 요약=Haiku, 추출=Sonnet).
          SUMMARIZE_MODEL: ${{ secrets.SUMMARIZE_MODEL }}
          EXTRACT_MODEL: ${{ secrets.EXTRACT_MODEL }}
          NO_NOTIFY: ${{ inputs.no_notify || steps.restore.outputs.initialized == 'true' }}
          HEALTH_ONLY: ${{ inputs.health_only }}
        run: |
          args=()
          if [[ "$NO_NOTIFY" == "true" ]]; then
            args+=(--no-notify)
          fi
          if [[ "$HEALTH_ONLY" == "true" ]]; then
            args+=(--health-only)
          fi
          python -m funded_project_research.collect "${args[@]}"

      - name: Recheck structured official application periods without email
        run: python -m funded_project_research.recheck --apply --limit 20 --report recheck-report.json

      - name: Preserve recheck evidence
        uses: actions/upload-artifact@v4
        with:
          name: recheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: recheck-report.json
          retention-days: 30

      - name: Validate collected DB before persistence and deployment
        run: python -m scripts.ci_db validate

      # 갱신된 DB를 data 브랜치에 커밋(main 이력 오염 방지).
      - name: Commit DB to data branch
        env:
          INITIALIZED: ${{ steps.restore.outputs.initialized }}
          DATA_SHA: ${{ steps.restore.outputs.data_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ "$INITIALIZED" == "true" ]]; then
            git worktree add --detach data-wt
            ( cd data-wt && git checkout --orphan data && git rm -rf --ignore-unmatch . )
          else
            git worktree add --detach data-wt "$DATA_SHA"
          fi
          cp gov_notices.db data-wt/gov_notices.db
          cd data-wt
          git add gov_notices.db
          if git diff --cached --quiet; then
            echo "DB unchanged"
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          git push origin HEAD:refs/heads/data

      - name: Build static dashboard
        run: |
          mkdir -p site
          python -m funded_project_research.serve --build site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Report source or collection failure after publishing status
        if: steps.collector.outcome == 'failure'
        run: |
          echo "수집 오류가 있습니다. 보존된 데이터와 출처 상태를 배포했으며 이 실행은 실패로 표시합니다."
          exit 1
